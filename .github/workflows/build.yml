        requested = ['6in4', 'alsa-lib', 'alsa-ucm-conf', 'alsa-utils', 'apk-openssl', 'attendedsysupgrade-common', 'autocore', 'automount', 'base-files', 'bash', 'ca-bundle', 'cfdisk', 'cgi-io', 'coreutils-timeout', 'curl', 'ddns-scripts', 'ddns-scripts-aliyun', 'ddns-scripts-cloudflare', 'ddns-scripts-services', 'default-settings', 'default-settings-chn', 'dnsmasq-full', 'dropbear', 'etherwake', 'etherwake-nfqueue', 'fdisk', 'firewall4', 'flock', 'getrandom', 'grub2', 'grub2-bios-setup', 'grub2-efi', 'i915-firmware-dmc', 'ip-full', 'iperf3', 'jq', 'jshn', 'kernel', 'kmod-8139cp', 'kmod-8139too', 'kmod-ac97', 'kmod-amazon-ena', 'kmod-amd-xgbe', 'kmod-asn1-decoder', 'kmod-bnx2', 'kmod-button-hotplug', 'kmod-crypto-acompress', 'kmod-crypto-aead', 'kmod-crypto-arc4', 'kmod-crypto-authenc', 'kmod-crypto-crc32', 'kmod-crypto-ecb', 'kmod-crypto-sha1', 'kmod-cryptodev', 'kmod-e1000', 'kmod-e1000e', 'kmod-forcedeth', 'kmod-fs-f2fs', 'kmod-hid', 'kmod-hid-generic', 'kmod-hwmon-core', 'kmod-i2c-algo-bit', 'kmod-i40e', 'kmod-igb', 'kmod-igbvf', 'kmod-igc', 'kmod-inet-diag', 'kmod-ipt-tproxy', 'kmod-ixgbe', 'kmod-ixgbevf', 'kmod-lib-crc-ccitt', 'kmod-lib-lzo', 'kmod-lib-textsearch', 'kmod-macvlan', 'kmod-mppe', 'kmod-net-selftests', 'kmod-nf-conntrack', 'kmod-nf-nathelper', 'kmod-nf-nathelper-extra', 'kmod-nfnetlink-queue', 'kmod-nft-core', 'kmod-nft-nat', 'kmod-nft-queue', 'kmod-nft-tproxy', 'kmod-pcnet32', 'kmod-phy-ax88796b', 'kmod-pppoe', 'kmod-r8101', 'kmod-r8125', 'kmod-r8126', 'kmod-r8168', 'kmod-regmap-core', 'kmod-sched-bpf', 'kmod-sched-core', 'kmod-snd-hda-scodec-component', 'kmod-sound-hda-codec-hdmi', 'kmod-sound-hda-codec-realtek', 'kmod-sound-hda-codec-via', 'kmod-sound-hda-core', 'kmod-sound-hda-intel', 'kmod-sound-i8x0', 'kmod-sound-mpu401', 'kmod-sound-via82xx', 'kmod-tg3', 'kmod-tulip', 'kmod-tun', 'kmod-usb-audio', 'kmod-usb-hid', 'kmod-usb-net', 'kmod-usb-net-asix', 'kmod-usb-net-asix-ax88179', 'kmod-usb-net-rtl8150', 'kmod-usb-net-rtl8152-vendor', 'kmod-v