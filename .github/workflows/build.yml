        make defconfig
        cp .config ../artifacts/build.config
        python3 - <<'PY'
        from pathlib import Path
        config = Path('.config').read_text()
        required = ['KERNEL_FTRACE', 'KERNEL_FUNCTION_TRACER', 'KERNEL_DYNAMIC_FTRACE', 'KERNEL_DEBUG_INFO_BTF', 'KERNEL_CGROUP_BPF']
        missing = [key for key in required if f'CONFIG_{key}=y' not in config.splitlines()]
        if missing:
