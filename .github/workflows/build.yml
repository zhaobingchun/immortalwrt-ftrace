# Build only. This workflow does not connect to or flash any router.
name: Build ImmortalWrt with UDP tracing
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: immortalwrt-ftrace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
    - name: Prepare temporary runner
      run: |
        mkdir -p artifacts
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl time xz-utils zstd libelf-dev pahole subversion
        df -h
    - name: Fetch official source
      run: |
        git clone --depth 1 --branch v25.12.2 https://github.com/immortalwrt/immortalwrt.git openwrt
        git -C openwrt rev-parse HEAD > artifacts/source-commit.txt
    - name: Install source feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        ./scripts/feeds list -s > ../artifacts/feeds.txt
        for directory in feeds/*; do
          if [ -d "$directory/.git" ] || [ -f "$directory/.git" ]; then
            printf '%s ' "$directory" >> ../artifacts/feed-commits.txt
            git -C "$directory" rev-parse HEAD >> ../artifacts/feed-commits.txt
          fi
        done
    - name: Configure current package selection and tracing
      working-directory: openwrt
      run: |
        cat > .config <<'CONFIG'
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        # CONFIG_TARGET_ROOTFS_EXT4FS is not set
        CONFIG_GRUB_IMAGES=y
        CONFIG_GRUB_EFI_IMAGES=y
        CONFIG_TARGET_IMAGES_GZIP=y
        CONFIG_TARGET_KERNEL_PARTSIZE=32
        CONFIG_TARGET_ROOTFS_PARTSIZE=300
        # CONFIG_ISO_IMAGES is not set
        # CONFIG_QCOW2_IMAGES is not set
        # CONFIG_VDI_IMAGES is not set
        # CONFIG_VMDK_IMAGES is not set
        # CONFIG_VHDX_IMAGES is not set
        CONFIG_KERNEL_FTRACE=y
        CONFIG_KERNEL_FUNCTION_TRACER=y
        CONFIG_KERNEL_DYNAMIC_FTRACE=y
        CONFIG_KERNEL_DEBUG_INFO=y
        # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
        CONFIG_KERNEL_DEBUG_INFO_BTF=y
        CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y
        CONFIG_KERNEL_BPF_EVENTS=y
        CONFIG_KERNEL_CGROUPS=y
        CONFIG_KERNEL_CGROUP_BPF=y
        CONFIG_LUCI_LANG_zh_Hans=y
        CONFIG_VERSIONOPT=y
        CONFIG_VERSION_DIST="ImmortalWrt"
        CONFIG_VERSION_NUMBER="25.12.2-ftrace"
        CONFIG_VERSION_REPO="https://downloads.immortalwrt.org/releases/25.12.2"
        # CONFIG_PACKAGE_dnsmasq is not set
        # CONFIG_PACKAGE_nftables is not set
        # CONFIG_PACKAGE_apk-mbedtls is not set
        # CONFIG_PACKAGE_opkg is not set
        # CONFIG_PACKAGE_kmod-drm-i915 is not set
        # CONFIG_PACKAGE_kmod-dwmac-intel is not set
        # CONFIG_PACKAGE_kmod-nft-offload is not set
