    - name: Download sources
      working-directory: openwrt
      run: |
        set -o pipefail
        make -j8 download V=s 2>&1 | tee ../artifacts/download.log
    - name: Compile firmware
      working-directory: openwrt
      run: |
        set -o pipefail
        make -j"$(nproc)" V=s 2>&1 | tee ../artifacts/build.log
    - name: Verify final kernel and collect images
      working-directory: openwrt
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import shutil
        out = Path('../artifacts')
        configs = list(Path('build_dir').glob('target-*/linux-*/linux-6.12.*/.config'))
        if len(configs) != 1:
            raise SystemExit('Expected exactly one generated Linux kernel config: ' + str(configs))
        config = configs[0].read_text()
        required = ['FUNCTION_TRACER', 'DYNAMIC_FTRACE', 'DYNAMIC_FTRACE_WITH_DIRECT_CALLS', 'DEBUG_INFO_BTF', 'CGROUP_BPF']
        missing = [key for key in required if f'CONFIG_{key}=y' not in config.splitlines()]
        shutil.copy2(configs[0], out / 'linux-kernel.config')
        if missing:
            raise SystemExit('Final Linux kernel is missing: ' + ', '.join(missing))
        images = list(Path('bin/targets/x86/64').glob('*-squashfs-combined-efi.img.gz'))
        if not images:
            raise SystemExit('No x86 squashfs EFI image was produced')
        for path in images:
            shutil.copy2(path, out / path.name)
        for name in ['sha256sums', 'config.buildinfo', 'feeds.buildinfo', 'profiles.json']:
            path = Path('bin/targets/x86/64') / name
            if path.is_file():
                shutil.copy2(path, out / name)
        PY
        tar -czf ../artifacts/custom-kernel-packages.tar.gz -C bin/targets/x86/64 packages
        (cd ../artifacts && sha256sum *.img.gz custom-kernel-packages.tar.gz > SHA256SUMS.local)
    - name: Upload firmware and diagnostic reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: immortalwrt-25.12.2-x86-64-ftrace
        path: artifacts/
        retention-days: 3
        compression-level: 0
        if-no-files-found: error
